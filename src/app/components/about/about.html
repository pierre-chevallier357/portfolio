<section (inView)="isInView.set(true)" [class.in-view]="isInView()" class="about-section" id="about" inView>
  <div class="about-content">
    <h1 class="about-title">À propos</h1>
    @for (paragraph of paragraphs(); track $index) {
      <p [innerHTML]="paragraph" class="about-text"></p>
    }
  </div>
  <figure class="picture-frame">
    <img alt="Portrait de Pierre" class="profile-picture" fill ngSrc="images/home/profile-picture.jpg"/>
  </figure>
</section>

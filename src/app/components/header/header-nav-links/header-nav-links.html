<div [class.active]="isMenuOpened()" class="header-links-wrapper fade-links">
  @for (link of navLinks(); track link.id) {
    <a (click)="closeMenu()" [href]="link.href" class="link">
      {{ link.text }}
    </a>
  }
  <theme-toggle/>
</div>
<button (click)="toggleMenu()" [class.opened]="isMenuOpened()" class="hamburger-button">
  <span class="line"></span>
  <span class="line"></span>
  <span class="line"></span>
</button>

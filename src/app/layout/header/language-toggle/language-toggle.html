<button
  (click)="toggleLanguage()"
  [attr.aria-label]="language() === 'fr' ? 'Switch to English' : 'Passer en français'"
  class="language-toggle"
  type="button"
>
  <svg aria-hidden="true" viewBox="0 0 24 24">
    <text font-family="serif" font-size="15" font-weight="700" x="1" y="15">A</text>
    <text font-family="sans-serif" font-size="13" font-weight="700" x="10" y="21">文</text>
  </svg>
  {{ label() }}
</button>

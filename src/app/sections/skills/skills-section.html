<section (inView)="isInView.set(true)" [class.in-view]="isInView()" class="page-section" id="skills"
         portfolioInView>
  <h1 class="skills-section-title">{{ title() }}</h1>

  <div class="skills-section-content">
    @for (category of categories(); track category.title) {
      <article class="skills-card">
        <header class="skills-card-header">
          <h2>{{ category.title }}</h2>
          <p class="skills-card-description">
            {{ category.description }}
          </p>
        </header>

        <div class="skills-list">
          @for (skill of category.skills; track skill.name) {
            <details class="skill-item">
              <summary>
                <div class="skill-summary-content">
                  <div class="skill-header">
                    <span>{{ skill.name }}</span>
                    <span>{{ skill.level }}%</span>
                  </div>

                  <div [attr.aria-label]="skill.name" [attr.aria-valuenow]="skill.level" aria-valuemax="100"
                       aria-valuemin="0" class="progress-bar" role="progressbar">
                    <div [class]="'progress-bar-fill ' + skill.color" [style.width.%]="skill.level"></div>
                  </div>
                </div>

                <svg aria-hidden="true" class="chevron" fill="none" stroke="currentColor" stroke-width="2"
                     viewBox="0 0 24 24">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </summary>

              <p class="skill-description">{{ skill.description }}</p>
            </details>
          }
        </div>
      </article>
    }
  </div>
</section>

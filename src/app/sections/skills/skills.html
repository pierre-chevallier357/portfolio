<section (inView)="isInView.set(true)" [class.in-view]="isInView()" class="skills-section" id="skills"
         portfolioInView>
  <h1 class="skills-title">{{ title() }}</h1>

  <div class="cards-container">
    @for (category of categories(); track category.title) {
      <article class="skill-card">
        <header class="card-header">
          <h2>{{ category.title }}</h2>
          <p class="card-description">
            {{ category.description }}
          </p>
        </header>

        <div class="skills-list">
          @for (skill of category.skills; track skill.name) {
            <div class="skill-item">
              <div class="skill-header">
                <span>{{ skill.name }}</span>
                <span>{{ skill.level }}%</span>
              </div>

              <div [attr.aria-label]="skill.name" [attr.aria-valuenow]="skill.level" aria-valuemax="100"
                   aria-valuemin="0" class="progress-bar" role="progressbar">
                <div [class]="'progress-bar-fill ' + skill.color" [style.width.%]="skill.level"></div>
              </div>
            </div>
          }
        </div>
      </article>
    }
  </div>
</section>

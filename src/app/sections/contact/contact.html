<section (inView)="isInView.set(true)" [class.in-view]="isInView()" class="contact-section" id="contact"
         portfolioInView>
  <h1 class="contact-title">{{ title() }}</h1>
  <!-- TODO remove-->
  <!--  <hr class="divider"/>-->

  <div class="contact-groups">
    <div class="contact-group">
      <h2 class="group-title">{{ contact().mailTitle }}</h2>
      <div class="mail-row">
        <a [href]="'mailto:' + contact().email" class="contact-link">
          <svg aria-hidden="true" class="link-icon" fill="none" viewBox="0 0 24 24">
            <path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2"/>
          </svg>
          <span>{{ contact().email }}</span>
        </a>
        <button (click)="copyEmail()" [attr.aria-label]="contact().copyLabel" class="copy-button" type="button">
          @if (copied()) {
            <svg aria-hidden="true" class="copy-icon" fill="none" viewBox="0 0 24 24">
              <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2"/>
            </svg>
          } @else {
            <svg aria-hidden="true" class="copy-icon" fill="none" viewBox="0 0 24 24">
              <rect height="13" rx="2" stroke="currentColor" stroke-width="2" width="13" x="9" y="9"/>
              <path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
            </svg>
          }
        </button>
      </div>
      <span aria-live="polite" class="visually-hidden">
        @if (copied()) {
          {{ contact().copiedLabel }}
        }
      </span>
    </div>

    <div class="contact-group">
      <h2 class="group-title">{{ contact().socialMediasTitle }}</h2>
      <ul class="social-medias-list">
        @for (link of contact().socialLinks; track link.name) {
          <li>
            <a [href]="link.href" class="contact-link" rel="noopener noreferrer" target="_blank">
              <svg aria-hidden="true" class="link-icon" fill="none" viewBox="0 0 24 24">
                <path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="2"/>
              </svg>
              <span>{{ link.name }}</span>
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</section>

<section (inView)="isInView.set(true)" [class.in-view]="isInView()" class="page-section"
         id="experience" portfolioInView>
  <h1 class="experience-section-title">{{ title() }}</h1>

  <div class="experience-section-content">
    @for (experience of experienceContent(); track experience.id) {
      <portfolio-experience-item [experience]="experience"/>
    }
  </div>
</section>

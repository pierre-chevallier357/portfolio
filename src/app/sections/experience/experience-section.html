<section (inView)="isInView.set(true)" [class.in-view]="isInView()" class="page-section"
         id="experience" portfolioInView>
  <h1 class="experience-title">{{ title() }}</h1>

  <div class="experience-content">
    @for (company of experience(); track company.id) {
      <portfolio-company-section [company]="company"/>
    }
  </div>
</section>

<p #meta class="entry-meta">
  <span>{{ mission().period }}</span>
  <span aria-hidden="true" class="entry-separator">|</span>
  <span>{{ mission().location }}</span>
</p>
<article class="entry-card">
  <h3 class="entry-role">{{ mission().role }} | {{ mission().company }}</h3>
  <p class="entry-summary">{{ mission().summary }}</p>
  <ul aria-label="Technologies" class="entry-tech">
    @for (tech of mission().technologies; track tech) {
      <li>
        <span class="tech-badge">{{ tech }}</span>
      </li>
    }
  </ul>
  <details class="entry-details">
    <summary>
      <span>{{ seeMoreLabel() }}</span>
      <svg aria-hidden="true" class="chevron" fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </summary>
    <p class="entry-description">{{ mission().description }}</p>
  </details>
</article>

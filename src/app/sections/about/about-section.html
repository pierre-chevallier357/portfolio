<section (inView)="isInView.set(true)" [class.in-view]="isInView()" class="page-section" id="about"
         portfolioInView>
  <h1 class="about-section-title">{{ title() }}</h1>
  <div class="about-section-content">
    <article class="about-card">
      @for (paragraph of paragraphs(); track $index) {
        <p [innerHTML]="paragraph" class="paragraph"></p>
      }
    </article>
    <figure class="picture-frame">
      <img [alt]="portraitAlt()" class="profile-picture" fill ngSrc="images/home/profile-picture.jpg"/>
    </figure>
  </div>
</section>

<ng-template #staticText>
  {{ homeTitle().hey }}
  <br/>
  {{ homeTitle().im }} <span class="name">{{ homeTitle().name }}</span>{{ homeTitle().a }}
</ng-template>

<span class="content">
  <ng-container *ngTemplateOutlet="staticText"/>
  <portfolio-self-writing-text/>
</span>

<!-- Hidden ghost stack: one variant per possible typed phrase, used only to reserve this
     heading's longest height so the typewriter effect never shifts the layout. -->
<span aria-hidden="true" class="ghost">
  @for (phrase of ghostPhrases(); track $index) {
    <span class="ghost-variant">
      <ng-container *ngTemplateOutlet="staticText"/>
      {{ phrase }}
    </span>
  }
</span>

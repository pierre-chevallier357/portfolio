<section (inView)="isInView.set(true)" [class.in-view]="isInView()" class="home-section" id="home"
         portfolioInView>
  <h1 class="home-title" portfolioHomeTitle></h1>
  <figure class="portrait">
    <img
      alt=""
      class="star-icon left"
      height="24"
      ngSrc="images/home/star.svg"
      priority
      width="24"
    />
    <img
      [alt]="portraitAlt()"
      class="profile-picture"
      height="450"
      ngSrc="images/home/profile-picture.jpg"
      priority
      width="450"
    />
    <img
      alt=""
      class="star-icon right"
      height="24"
      ngSrc="images/home/star.svg"
      priority
      width="24"
    />
  </figure>
  <a class="about-link" href="#about">{{ aboutLabel() }} ↓</a>
</section>

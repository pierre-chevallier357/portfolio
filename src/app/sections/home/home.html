<section (inView)="isInView.set(true)" [class.in-view]="isInView()" class="home-section" id="home"
         portfolioInView>
  <h1 class="home-title">
    {{ title().hey }}
    <br/>
    {{ title().im }} <span
    [class]="'name' + (isDarkMode() ? ' dark' : ' light')">Pierre Chevallier</span>{{ title().a }}
    <portfolio-self-writing-text/>
  </h1>
  <figure class="portrait">
    <img
      [alt]="starAlt()"
      class="star-icon left"
      height="24"
      ngSrc="images/home/star.svg"
      priority
      width="24"
    />
    <img
      [alt]="portraitAlt()"
      class="profile-picture"
      height="450"
      ngSrc="images/home/profile-picture.jpg"
      priority
      width="450"
    />
    <img
      [alt]="starAlt()"
      class="star-icon right"
      height="24"
      ngSrc="images/home/star.svg"
      priority
      width="24"
    />
  </figure>
  <a class="about-link" href="#about">À propos ↓</a>
</section>

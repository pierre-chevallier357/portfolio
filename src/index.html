<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <title>Pierre Chevallier</title>
  <base href="/"/>
  <link href="images/favicon.png" rel="icon" type="image/png"/>

  <meta content="Pierre Chevallier - Portfolio" name="description"/>
  <meta content="Pierre Chevallier" name="author"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <!-- Open Graph -->
  <meta content="website" property="og:type"/>
  <meta content="Pierre Chevallier" property="og:title"/>
  <meta content="Pierre Chevallier - Portfolio" property="og:description"/>
  <meta content="https://pierre-chevallier.com" property="og:url"/>
  <meta content="https://pierre-chevallier.com/images/website-preview.png" property="og:image"/>
  <meta content="1200" property="og:image:width"/>
  <meta content="630" property="og:image:height"/>
  <meta content="Pierre Chevallier - Portfolio" property="og:image:alt"/>
  <meta content="fr_FR" property="og:locale"/>

  <!-- Twitter / X -->
  <meta content="summary_large_image" name="twitter:card"/>
  <meta content="Pierre Chevallier" name="twitter:title"/>
  <meta content="Pierre Chevallier - Portfolio" name="twitter:description"/>
  <meta content="https://pierre-chevallier.com/images/website-preview.png" name="twitter:image"/>
  <script>
    // Applies the user's previously chosen language before first paint, so the
    // `lang` attribute (used by screen readers/translators) is correct from
    // the start instead of flashing the server-rendered default ("fr").
    (function () {
      try {
        var storedLanguage = window.localStorage.getItem('language');
        if (storedLanguage === 'en' || storedLanguage === 'fr') {
          document.documentElement.setAttribute('lang', storedLanguage);
        }
      } catch (e) {
        // localStorage may be unavailable (private browsing, disabled storage); keep the default.
      }
    })();
  </script>
</head>
<body>
<portfolio-root></portfolio-root>
</body>
</html>
